[project]
name = "standup"
version = "0.1.0"
description = "Morning triage inbox: joins Claude Code session logs with git repo state"
requires-python = ">=3.11"
# claude-agent-sdk is the Audit panel's transport (ADR 0007) — imported lazily
# by auditgen only; the display path never touches it.
# textual is the Watch's UI (ADR 0008) — imported only by watchui; the event
# stream (watchstream) and every snapshot view stay plain stdout.
dependencies = [
    "claude-agent-sdk>=0.1",
    "textual>=8.2.8",
]

[project.scripts]
standup = "standup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standup"]
