[project]
name = "standup"
version = "0.1.0"
description = "Morning triage inbox: joins Claude Code session logs with git repo state"
requires-python = ">=3.11"
# claude-agent-sdk is the fan-out transport behind the LLM-pass seam
# (ADR 0003 § the LLM-pass seam) — imported lazily by `llmpass` when an Audit's
# Expert Panel runs; the display path never touches it.
# textual is the Watch's UI (ADR 0004 § the stream/UI boundary) — imported only
# by watchui; the event stream and every snapshot view stay plain stdout.
# pygments colors the Watch's diff bodies (monokai); rich already ships it
# transitively — declared because watchui imports it directly.
dependencies = [
    "claude-agent-sdk>=0.1",
    "pygments>=2.13",
    "textual>=8.2.8",
]

[project.scripts]
standup = "standup.cli:main"

# `git` is the suite's one external binary; see tests/conftest.py for what it
# isolates and README.md § Tests for how to run it.
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standup"]
